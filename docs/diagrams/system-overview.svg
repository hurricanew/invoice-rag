<!-- Deployed-today caption -->
<rect x="20" y="650" width="640" height="40" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="340" y="663" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#2c2c2a">Deployed today: single Lambda + Function URL (no auth), no Step Functions/DynamoDB/API Gateway,</text>
