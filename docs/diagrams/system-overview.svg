<svg width="680" height="700" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Accounts-payable agent — system overview (target design)</title>
<desc>TARGET DESIGN, not the current deployment. A client calls API Gateway, which routes to four Lambda handlers: start run, get run, approve or reject, and evaluations. Start run and approve/reject drive a Step Functions workflow. The workflow, from inside its own states, calls out to two external dependencies: the policy document corpus for retrieval and Bedrock for its one model decision. All run state and audit events persist in DynamoDB. The actual deployed Stage B system today is a single Lambda behind a Function URL with in-memory /tmp persistence — see the banner and caption on this diagram.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="700" fill="#ffffff"/>

