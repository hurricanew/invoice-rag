<rect x="20" y="10" width="640" height="34" rx="6" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
<text x="340" y="27" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#412402">TARGET DESIGN — not what is currently deployed. See caption below.</text>

<!-- Client -->
<g>
