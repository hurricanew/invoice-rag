<svg width="680" height="640" viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Accounts-payable agent — system overview</title>
<desc>A client calls API Gateway, which routes to four Lambda handlers: start run, get run, approve or reject, and evaluations. Start run and approve/reject drive a Step Functions workflow. The workflow, from inside its own states, calls out to two external dependencies: the policy document corpus for retrieval and Bedrock for its one model decision. All run state and audit events persist in DynamoDB.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="640" fill="#ffffff"/>

<!-- Client -->
<g>
<rect x="260" y="30" width="160" height="44" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2c2c2a">Client / reviewer</text>
</g>
<line x1="340" y1="74" x2="340" y2="106" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- API Gateway -->
<g>
<rect x="230" y="106" width="220" height="50" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="340" y="124" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">API Gateway</text>
<text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5f5e5a">runs, decision, evaluations</text>
</g>
<line x1="340" y1="156" x2="340" y2="188" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Lambda handlers -->
<g>
<rect x="60" y="188" width="130" height="50" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
<text x="125" y="206" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215c">Start run</text>
<text x="125" y="222" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534ab7">StartExecution</text>
</g>
<g>
<rect x="205" y="188" width="130" height="50" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
<text x="270" y="206" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215c">Get run</text>
<text x="270" y="222" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534ab7">reads DynamoDB</text>
</g>
<g>
<rect x="350" y="188" width="130" height="50" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
<text x="415" y="206" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215c">Approve/reject</text>
<text x="415" y="222" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534ab7">SendTaskSuccess</text>
</g>
<g>
<rect x="495" y="188" width="130" height="50" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
<text x="560" y="206" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215c">Evaluations</text>
<text x="560" y="222" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534ab7">runs FIN-00X</text>
</g>

<line x1="125" y1="238" x2="230" y2="278" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="415" y1="238" x2="360" y2="278" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Step Functions block -->
<g>
<rect x="150" y="278" width="380" height="80" rx="12" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="340" y="306" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342c">Step Functions workflow</text>
<text x="340" y="328" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0f6e56">retrieve, reconcile, decide, approve, submit — see workflow-detail.svg</text>
</g>

<line x1="230" y1="358" x2="200" y2="400" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="450" y1="358" x2="480" y2="400" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect x="100" y="400" width="200" height="52" rx="8" fill="#fbeaf0" stroke="#993556" stroke-width="0.5"/>
<text x="200" y="418" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4b1528">Policy corpus</text>
<text x="200" y="436" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993556">S3 + embeddings</text>
</g>

<g>
<rect x="380" y="400" width="200" height="52" rx="8" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
<text x="480" y="418" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">Bedrock + Guardrails</text>
<text x="480" y="436" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#a32d2d">model config via env vars</text>
</g>

<line x1="340" y1="358" x2="340" y2="490" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect x="190" y="490" width="300" height="90" rx="12" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
<text x="340" y="514" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042c53">DynamoDB</text>
<text x="340" y="534" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185fa5">runs, audit events, idempotency keys,</text>
<text x="340" y="550" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185fa5">approval tokens, token/cost per run</text>
</g>

<path d="M270 238 L 270 490" fill="none" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
</svg>
